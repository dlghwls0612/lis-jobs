meta:
  project: 서울·경기 기록관리 채용 레이더 (Records Job Radar)
  description: 서울·경기 공공기관, 지자체(기록연구사), 대학, 연구원, 민간 아카이브 채용공고 자동 수집
  target_regions:
    - 서울
    - 경기
  updated_at: null

settings:
  # 직무 유효 키워드 (제목 또는 본문에 하나 이상 포함되어야 함)
  keywords_include:
    - 기록연구사
    - 기록연구
    - 기록물관리전문요원
    - 기록물관리
    - 기록물          # 2026-11-26: '기록물 디지털화'·'공무직(기록물)'처럼 '관리'가 안 붙은 공고가 빠지던 것 보강
    - 기록관리
    - 아키비스트
    - 아카비스트
    - 기록관
    - 민간기록
    - 특수기록
    # '아카이브'는 2026-11-26 아래 keywords_weak 로 옮김(패션·카페 브랜드 이름에 흔해서 단독 통과 금지)

  # ── 약한 단어 규칙(2026-11-26). 제목에 약한 단어가 있어도 혼자서는 통과 못 한다.
  #    ① 사람인 직무 태그가 strong_tags 중 하나이거나 ② 제목에 weak_work_words 가 함께 있어야 통과.
  #    ①·②로 통과한 공고는 직무 태그가 block_tag_parts 에 걸리면 다시 뺀다.
  #    (오늘 사람인 406건 실측: 단순 통과 8건 중 4건이 패션 브랜드 → 이 규칙 5건 통과·오탐 0)
  keywords_weak:
    - 아카이브
    - 아카이빙
    - 메타데이터
  weak_work_words:
    - 구축
    - 작성
    - 입력
    - 등록
    - 정리
    - 디지털
    - 아카이브부
    - DB
    - 데이터베이스
    - 목록
    - 분류
  strong_tags:          # 사람인 직무 태그(업무 종류 표시) — 이 태그면 업무 자체가 기록·아카이브 쪽
    - 아카이브
    - 메타데이터
    - 문헌정보
    - 기록물전문요원
  block_tag_parts:      # 약한 단어·태그로 통과한 공고 중 이 글자가 든 태그가 있으면 제외
    - 의류
    - 패션
    - 판매
    - 매장
    - MD
    - 바리스타
    - 주방
    - 음식료
    - 디자인
    - 마케팅
    - 쇼핑몰
    - 백엔드
    - 프론트엔드
    - 개발
    - 엔지니어
    - DBA
    - 데이터분석     # '메타데이터' 태그만 달린 데이터 분석·거버넌스 직무 차단
    - 빅데이터
    - DW

  # 오탐 제외 키워드 (해당 단어가 포함되면 기록관리 직무가 아니므로 제외)
  keywords_exclude:
    - 의무기록사
    - 보건의료정보관리사
    - 생활기록부
    - 기록경기
    - 단순입력
    - 단순 입력
    - 녹취
    - 속기록
    - 베이커리
    - 제과
    - 제빵
    - 바리스타
    - 식음료
    - 카페
    - 조리
    - 파쇄
    - 문서파쇄

  # 지역 판별 키워드 (전국 공고 중 서울/경기만 선별)
  regions_include:
    서울:
      - 서울
      - 강남
      - 강동
      - 강북
      - 강서
      - 관악
      - 광진
      - 구로
      - 금천
      - 노원
      - 도봉
      - 동대문
      - 동작
      - 마포
      - 서대문
      - 서초
      - 성동
      - 성북
      - 송파
      - 양천
      - 영등포
      - 용산
      - 은평
      - 종로
      - 중구
      - 중랑
    경기:
      - 경기
      - 수원
      - 성남
      - 고양
      - 용인
      - 부천
      - 안산
      - 안양
      - 남양주
      - 화성
      - 평택
      - 의정부
      - 시흥
      - 파주
      - 광명
      - 김포
      - 군포
      - 광주
      - 이천
      - 양주
      - 오산
      - 구리
      - 안성
      - 포천
      - 의왕
      - 하남
      - 여주
      - 양평
      - 동두천
      - 과천
      - 가평
      - 연천

  # 채용 형태 분류 규칙
  jobtype_rules:
    정규:
      - 정규직
      - 공채
      - 일반직
      - 전임
    임기제:
      - 임기제
      - 지방기록연구사
      - 국가기록연구사
      - 전문경력관
      - 개방형
    계약:
      - 계약직
      - 기간제
      - 무기계약
      - 공무직
      - 대체인력
      - 육아휴직대체
    인턴:
      - 인턴
      - 청년인턴
      - 체험형

  # 자격 요건 태깅 규칙
  credential_rules:
    specialist_required: # 기록물관리전문요원 필수
      - 기록물관리전문요원
      - 전문요원
      - 기록물관리 전문요원
      - 기록관리학 석사

  closure:
    result_keywords:
      - 서류전형 합격자
      - 1차 합격자
      - 최종 합격자
      - 면접전형 결과
      - 채용결과
      - 전형결과
      - 합격자 공고
    safety_expire_days: 25

sources:
  - id: karma-notice
    name: 사단법인 한국기록전문가협회(KARMA)
    type: hub_board
    category: 협회·전문커뮤니티
    url: https://www.archivists.or.kr/category/NOTICE/%EC%B1%84%EC%9A%A9%EA%B3%B5%EA%B3%A0
    engine: httpx
    enabled: true

  - id: alio-records
    name: 잡알리오 공공기관 채용정보
    type: public_api_or_search
    category: 공공기관·공기업
    url: https://job.alio.go.kr/recruit.do
    keywords:
      - 기록물
      - 기록연구
      - 아키비스트
      - 기록관리
    engine: httpx
    enabled: true

  - id: gojobs-records
    name: 인사혁신처 나라일터
    type: public_api_or_search
    category: 지자체·국가기관(기록연구사)
    url: https://www.gojobs.go.kr/apmList.do
    keywords:            # 실제 검색어는 crawler/records/gojobs.py 의 기본값
      - 기록연구
      - 기록물
      - 아키비스트
    engine: httpx        # 목록이 서버에서 그려져 httpx 로 충분(2026-10-24 실측)
    enabled: true

  - id: cleaneye-records
    name: 클린아이 잡플러스
    type: public_api_or_search
    category: 지방공기업·출연기관
    url: https://job.cleaneye.go.kr/user/ypRecruitment.do
    engine: httpx        # JSON API(/user/selectYpRecruitment.do), 도서관 탭과 1회 조회 공유(2026-11-27)
    enabled: true

  - id: jobkorea-records
    name: 잡코리아
    type: public_api_or_search
    category: 문화재단·공공·민간
    url: https://www.jobkorea.co.kr/Search/
    keywords:            # 실제 검색어는 crawler/records/jobkorea.py 의 기본값
      - 기록물관리
      - 기록물
      - 기록연구
      - 아키비스트
      - 기록관리전문요원
      - 디지털아카이브
      - 메타데이터
    engine: httpx        # CardJob 파싱 + 통과 공고만 상세 JSON-LD 마감일 조회(2026-11-27)
    enabled: true
